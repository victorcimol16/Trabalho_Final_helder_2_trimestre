<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="style.css">
    <title>Aviator | Pesquisa</title>
</head>
<body>

<div class="app">

    <main class="tela">

        <section class="boas-vindas">
            <p class="ola">Bom dia!</p>
            <h1 class="nome-usuario">Bem vindo, Victor!</h1>

            <label class="campo">
                <svg class="icone" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                <input type="text" placeholder="Origem">
            </label>

            <label class="campo">
                <svg class="icone icone-cheio" viewBox="0 0 24 24"><path transform="rotate(135 12 12)" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                <input type="text" placeholder="Destino">
            </label>

            <label class="campo">
                <svg class="icone" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>
                <input type="text" placeholder="Data">
            </label>

            <a class="btn" href="resultados.html">Pesquisar</a>
        </section>

        <section class="conteudo">
            <h2 class="subtitulo">Pesquisas recentes</h2>

            <div class="espaco">
                <a class="cartao recente" href="resultados.html">
                    <span class="recente-icone">
                        <svg class="icone icone-g" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3.5V8h4.5"/><path d="M12 7.5V12l3 1.8"/></svg>
                    </span>
                    <span>
                        <span class="recente-rota">London (LHR) &rarr; Paris (LBG)</span>
                        <span class="recente-data">Procurado há 2 dias.</span>
                    </span>
                </a>

                <a class="cartao recente" href="resultados.html">
                    <span class="recente-icone">
                        <svg class="icone icone-g" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3.5V8h4.5"/><path d="M12 7.5V12l3 1.8"/></svg>
                    </span>
                    <span>
                        <span class="recente-rota">New York (TEB) &rarr; Miami</span>
                        <span class="recente-data">Procurado há 5 dias.</span>
                    </span>
                </a>
            </div>
        </section>

    </main>

    <nav class="barra">
        <span class="marca">Aviator</span>
        <a href="index.html" class="ativo">
            <svg class="icone icone-g" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg>
            <span>Pesquisa</span>
        </a>
        <a href="agendamentos.html">
            <svg class="icone icone-g" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>
            <span>Agenda</span>
        </a>
        <a href="#">
            <svg class="icone icone-g" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l1.4-5.2A8.5 8.5 0 1 1 21 11.5Z"/></svg>
            <span>Suporte</span>
        </a>
        <a href="#">
            <svg class="icone icone-g" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
            <span>Perfil</span>
        </a>
    </nav>

</div>

</body>
</html>
